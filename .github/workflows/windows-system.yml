name: windows-system
on:
  workflow_call:
    inputs:
      tests_ref:
        description: Exact soksak-terminal-tests commit to execute
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  system:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      SOKSAK_TEST_PLATFORM: windows
      SOKSAK_TEST_TARGET: x86_64-pc-windows-msvc
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: min-median-max/soksak-terminal-tests
          ref: ${{ inputs.tests_ref }}
          path: tests
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: tests/go.mod
          cache-dependency-path: tests/go.sum
      - shell: pwsh
        run: choco install make --version=4.4.1 --no-progress --yes
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: core-windows-artifact
          path: core
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage/evidence | Out-Null
          make -C tests fleet TARGET=x86_64-pc-windows-msvc
      - shell: pwsh
        env:
          SOKSAK_TEST_CLI: ${{ github.workspace }}\core\sok.exe
          SOKSAK_TEST_APP: ${{ github.workspace }}\core\soksak.exe
          SOKSAK_TEST_HOME: ${{ github.workspace }}\stage\system-home
          SOKSAK_TEST_RUNTIME: ${{ github.workspace }}\stage\runtime
          SOKSAK_TEST_WORKSPACE: ${{ github.workspace }}\stage\workspace
          SOKSAK_TEST_IDENTIFIER: com.soksak.windowsfleet
          SOKSAK_TEST_EVIDENCE: ${{ github.workspace }}\stage\evidence
        run: |
          New-Item -ItemType Directory -Force $env:SOKSAK_TEST_HOME,$env:SOKSAK_TEST_RUNTIME,$env:SOKSAK_TEST_WORKSPACE,$env:SOKSAK_TEST_EVIDENCE|Out-Null
          make -C tests system-commands TARGET=x86_64-pc-windows-msvc
          make -C tests system-restore TARGET=x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: windows-terminal-system-evidence
          path: stage/evidence
          if-no-files-found: error
