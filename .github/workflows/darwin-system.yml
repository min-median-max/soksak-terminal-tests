name: darwin-system
on:
  workflow_call:
    inputs:
      tests_ref:
        description: Exact soksak-terminal-tests commit to execute
        required: true
        type: string
      runner:
        description: Native GitHub macOS runner label
        required: true
        type: string
      artifact:
        description: Exact Core build artifact name
        required: true
        type: string
      architecture:
        description: Native runner and thin-binary architecture
        required: true
        type: string
      target:
        description: Immutable sidecar artifact target
        required: true
        type: string
      variant:
        description: Core artifact shape, thin or universal
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  system:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    env:
      SOKSAK_TEST_PLATFORM: darwin
      SOKSAK_TEST_TARGET: ${{ inputs.target }}
      SOKSAK_TEST_IDENTIFIER: com.soksak.darwinfleet.${{ inputs.variant }}.${{ inputs.architecture }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: min-median-max/soksak-terminal-tests
          ref: ${{ inputs.tests_ref }}
          path: tests
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: tests/go.mod
          cache-dependency-path: tests/go.sum
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.artifact }}
          path: core
      - run: |
          case "${{ inputs.architecture }}/${{ inputs.target }}/${{ inputs.runner }}" in
            arm64/aarch64-apple-darwin/macos-15|x86_64/x86_64-apple-darwin/macos-15-intel) ;;
            *) echo "Darwin runner, architecture and target do not match" >&2; exit 1 ;;
          esac
          case "${{ inputs.variant }}" in thin|universal) ;; *) echo "invalid Darwin artifact variant" >&2; exit 1 ;; esac
          test "$(uname -m)" = "${{ inputs.architecture }}"
          chmod +x core/sok core/soksak.app/Contents/MacOS/soksak
          app_arches=$(lipo -archs core/soksak.app/Contents/MacOS/soksak)
          cli_arches=$(lipo -archs core/sok)
          if [ "${{ inputs.variant }}" = universal ]; then
            test "$app_arches" = "x86_64 arm64"
            test "$cli_arches" = "x86_64 arm64"
          else
            test "$app_arches" = "${{ inputs.architecture }}"
            test "$cli_arches" = "${{ inputs.architecture }}"
          fi
          mkdir -p stage/evidence stage/system-home stage/workspace /tmp/soksak-runtime
          make -C tests fleet TARGET="${{ inputs.target }}"
      - env:
          SOKSAK_TEST_CLI: ${{ github.workspace }}/core/sok
          SOKSAK_TEST_APP: ${{ github.workspace }}/core/soksak.app/Contents/MacOS/soksak
          SOKSAK_TEST_HOME: ${{ github.workspace }}/stage/system-home
          SOKSAK_TEST_RUNTIME: /tmp/soksak-runtime
          SOKSAK_TEST_WORKSPACE: ${{ github.workspace }}/stage/workspace
          SOKSAK_TEST_EVIDENCE: ${{ github.workspace }}/stage/evidence
        run: |
          make -C tests system-commands TARGET="${{ inputs.target }}"
          make -C tests system-restore TARGET="${{ inputs.target }}"
          make -C tests system-native-focus TARGET="${{ inputs.target }}"
          make -C tests system-native-cursor TARGET="${{ inputs.target }}"
          make -C tests system-native-keyboard TARGET="${{ inputs.target }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: darwin-${{ inputs.variant }}-${{ inputs.architecture }}-terminal-system-evidence
          path: stage/evidence
          if-no-files-found: error
